# highspy 1.15.1's PyPI wheel (macOS arm64) reports 'Optimal' 58 on a model with a feasible 56; local
# builds of the same commit give 56. The wheel was built on macos-14 with Xcode 15.4 (SDK 14.5). This
# rebuilds it on the same runner with Xcode 15.4 and 16.2, without LTO or unity build, and with the
# debug-solution checks (DEBUGSOL, assertions on). The model is encrypted; the key is a repo secret.
name: wrongopt

on:
  push:
    branches: [wrongopt-ci]

jobs:
  solve:
    name: ${{ matrix.task || 'solve' }} ${{ matrix.variant }} ${{ matrix.ref }}${{ matrix.patch && ' + ' || '' }}${{ matrix.patch }} (Xcode ${{ matrix.xcode }})
    runs-on: macos-14
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # runs 1-2: pypi-wheel, sdist 15.4, no-unity 15.4: 58; sdist 16.2, no-lto 15.4: 56;
        # debugsol 15.4 asserts, debugsol 16.2: 56. Run 3: the failing bound change comes from
        # finishAnalyticCenterComputation (column 35545 fixed to 0).
        # Variants: pypi-wheel, sdist, no-lto, no-unity, debugsol (Xcode 15.4 or 16.2);
        # task: solve (default) or ac (the analytic centre, wrongopt/ac.py). Run 5: IPX stalls ("no
        # progress") in every build; 1.15.1 still accepts the point as the centre when the objective gap
        # is small. Upstream 469c60a8e (22 Oct) accepts it only if centring succeeded.
        # variant src: HiGHS at ref, plus wrongopt/<patch> if given. Run 6: 1.15.1 58, + 469c60a8e 56,
        # latest 56. task check: the engine's tests/highs/check.py (encrypted in wrongopt/highs-tests.tar.enc)
        include:
          - { variant: pypi-wheel, xcode: "15.4", task: check }
          - { variant: src, xcode: "15.4", ref: 399f1c0b12a3f2a7c03f71ad4be372ba63d6163e, task: check }
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      # as cibuildwheel sets them for macosx_arm64
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHFLAGS: -arch arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: { repository: ERGO-Code/HiGHS, ref: "${{ matrix.ref || 'v1.15.1' }}", path: HiGHS }
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }

      - name: Toolchain
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu; ls -d /Applications/Xcode*.app
          clang --version; xcrun --show-sdk-version; xcrun ld -version_details | head -3 || true
          cmake --version | head -1; openssl version; python -VV
          git -C HiGHS log -1 --format='HiGHS %H %d'

      - name: Decrypt model
        env: { KEY: "${{ secrets.WRONGOPT_KEY }}" }
        run: |
          for f in model.mps x56.sol; do
            openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:KEY -in wrongopt/$f.gz.enc | gunzip > $f
          done
          shasum -a 256 model.mps x56.sol
          mkdir -p tests
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:KEY -in wrongopt/highs-tests.tar.enc | tar -C tests -xf -
          ls -la tests/highs

      - name: Install highspy
        run: |
          python -m pip install -q -U pip
          V="-v -C build.verbose=true"
          case "${{ matrix.variant }}" in
            pypi-wheel) pip install --only-binary=:all: highspy==1.15.1 ;;
            src)
              if [ -n "${{ matrix.patch }}" ]; then git -C HiGHS apply -v ../wrongopt/${{ matrix.patch }}; fi
              pip install $V ./HiGHS ;;
            sdist) pip install $V --no-binary=highspy highspy==1.15.1 ;;
            no-lto) pip install $V --no-binary=highspy highspy==1.15.1 -C cmake.define.CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF ;;
            no-unity)
              sed -i '' 's/UNITY_BUILD ON/UNITY_BUILD OFF/' HiGHS/highs/CMakeLists.txt
              grep -n UNITY_BUILD HiGHS/highs/CMakeLists.txt
              pip install $V ./HiGHS ;;
            debugsol)
              # Release would add NDEBUG and compile the checks out; keep -O3 and LTO otherwise.
              # Keep the LTO objects so that lldb finds line info and inlined frames.
              mkdir -p $HOME/lto
              pip install $V ./HiGHS -C cmake.build-type=RelWithDebInfo \
                -C "cmake.define.CMAKE_SHARED_LINKER_FLAGS=-Wl,-object_path_lto,$HOME/lto" \
                -C "cmake.define.CMAKE_CXX_FLAGS_RELWITHDEBINFO=-O3 -g" \
                -C "cmake.define.CMAKE_C_FLAGS_RELWITHDEBINFO=-O3 -g" -C cmake.define.DEBUGSOL=ON ;;
          esac

      - name: Binary
        run: |
          D=$(python -c "import highspy, os; print(os.path.dirname(highspy.__file__))")
          ls -la $D
          for f in $D/libhighs.1.dylib $D/_core*.so; do
            echo "== $f"; otool -l $f | grep -A7 LC_BUILD_VERSION | grep -E 'minos|sdk|version'
            size -m $f | grep -E '__text|__TEXT'
            echo "text sha256 $(otool -X -t $f | shasum -a 256 | cut -c1-16)"
          done

      - name: Solve
        run: |
          set +e
          if [ "${{ matrix.task }}" = check ]; then
            python tests/highs/check.py
          elif [ "${{ matrix.task }}" = ac ]; then
            python wrongopt/ac.py model.mps
          elif [ "${{ matrix.variant }}" = debugsol ]; then
            # the failing check (HighsDebugSol.cpp:153) is a bound change that cuts off the 56 solution;
            # -k runs after the crash stop, in the frame of boundChangeAdded
            ls $HOME/lto | head -3
            lldb --batch -o "settings set target.process.stop-on-exec false" -o run \
              -k "thread backtrace -c 60" -k "frame variable -D 1" \
              -k "expr -- (double)this->debugSolution[domchg.column]" \
              -k "up" -k "frame variable -D 1" -k "up" -k "frame variable -D 1" \
              -k "up" -k "frame variable -D 1" -k "up" -k "frame variable -D 1" \
              -k kill -k quit -- python wrongopt/run.py model.mps --debug-sol=x56.sol
          else
            python wrongopt/run.py model.mps --dev=1
          fi
          echo "exit code $?"
          exit 0
